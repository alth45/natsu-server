<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>なつServer - Electron Edition</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <!-- ============ SIDEBAR KIRI ============ -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">⚡</div>
        <div class="brand-text">
          <span class="brand-name">なつServer</span>
          <span class="brand-sub">Local Dev Suite</span>
        </div>
      </div>

      <div class="side-section-title">Tools</div>
      <button class="side-btn" id="btn-web" disabled>
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.9 5.7 3.9 9S14.5 18.4 12 21c-2.5-2.6-3.9-5.7-3.9-9S9.5 5.6 12 3z"/></svg>
        <span>Buka Browser</span>
      </button>
      <button class="side-btn" id="btn-db">
        <svg viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
        <span>Database</span>
      </button>
      <button class="side-btn" id="btn-folder">
        <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
        <span>Folder (www)</span>
      </button>
      <button class="side-btn" id="btn-terminal">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M12.5 15H17"/></svg>
        <span>Terminal</span>
      </button>
      <button class="side-btn" id="btn-ngrok">
        <svg viewBox="0 0 24 24"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1.6 1.5"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1.6-1.5"/></svg>
        <span>Share Live</span>
      </button>
      <button class="side-btn" id="btn-laravel">
        <svg viewBox="0 0 24 24"><path d="M4.5 16.5L12 4l7.5 12.5H16l-4-7-4 7H4.5z"/><path d="M13.5 16.5H20"/></svg>
        <span>New Laravel</span>
      </button>

      <div class="side-divider"></div>

      <label class="switch-row">
        <span class="switch-label">Mail Catcher</span>
        <span class="switch">
          <input type="checkbox" id="mail-switch">
          <span class="slider"></span>
        </span>
      </label>
      <button class="side-btn" id="btn-mail-ui" disabled>
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
        <span>Buka Web Mail</span>
      </button>

      <div class="spacer"></div>
      <button class="side-btn quit" id="btn-quit">
        <svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H3"/></svg>
        <span>Keluar Aplikasi</span>
      </button>
    </aside>

    <!-- ============ PANEL UTAMA ============ -->
    <main class="main-panel">
      <!-- Header + Status -->
      <header class="topbar">
        <div class="topbar-title">
          <h1>Dashboard</h1>
          <p>Kontrol server lokal &amp; tools pengembangan</p>
        </div>
        <div class="status-pill offline" id="status-label">
          <span class="status-dot"></span>
          <span class="status-text">OFFLINE</span>
        </div>
      </header>

      <!-- Grid Aksi Horizontal -->
      <section class="actions-grid">
        <button class="action-btn primary" id="btn-start">
          <svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5-13-7.5z"/></svg>
          <span class="action-label">START</span>
          <span class="action-hint">Jalankan semua service</span>
        </button>
        <button class="action-btn danger" id="btn-stop" disabled>
          <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          <span class="action-label">STOP</span>
          <span class="action-hint">Hentikan semua service</span>
        </button>
        <button class="action-btn" id="btn-open-web" disabled>
          <svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M19 14v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/></svg>
          <span class="action-label">Buka Web</span>
          <span class="action-hint">localhost di browser</span>
        </button>
        <button class="action-btn" id="btn-tools">
          <svg viewBox="0 0 24 24"><path d="M12 3l1.9 4.6 4.9.4-3.7 3.2 1.1 4.8L12 13.7 7.8 16l1.1-4.8L5.2 8l4.9-.4L12 3z"/></svg>
          <span class="action-label">Quick Tools</span>
          <span class="action-hint">Klik kanan utk opsi lain</span>
        </button>
      </section>

      <!-- Log Card -->
      <section class="card log-card">
        <div class="log-header">
          <span class="term-dots" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="log-title">Terminal Log</span>
          <div class="log-actions">
            <button class="log-action-btn" id="clear-log" title="Bersihkan Log">
              <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2m3 0v14a1 1 0 01-1 1H6a1 1 0 01-1-1V6"/></svg>
            </button>
            <button class="log-action-btn" id="autoscroll-toggle" title="Auto-Scroll: ON">
              <svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
            </button>
            <button class="toggle-log-btn" id="toggle-log" title="Show/Hide Log">
              <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
            </button>
          </div>
        </div>
        <div class="console-wrap">
          <div class="console" id="console" role="log" aria-live="polite"><div class="log-line">&nbsp;</div></div>
        </div>
      </section>

      <footer class="footer">なつServer v1.0 • Electron Edition</footer>
    </main>
  </div>

  <!-- Context Menu (klik kanan) -->
  <div class="context-menu hidden" id="context-menu">
    <div class="ctx-item" data-action="dashboard">Dashboard</div>
    <div class="ctx-item" data-action="settings">Settings</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" data-action="toggle-log">Toggle Log</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" data-action="about">About</div>
    <div class="ctx-item" data-action="exit">Exit</div>
  </div>

  <!-- Modal prompt (pengganti CTkInputDialog) -->
  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal">
      <div class="modal-title" id="modal-title">Input</div>
      <div class="modal-text" id="modal-text"></div>
      <input type="text" class="modal-input" id="modal-input" autocomplete="off">
      <div class="modal-actions">
        <button class="modal-btn cancel" id="modal-cancel">Batal</button>
        <button class="modal-btn ok" id="modal-ok">OK</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
